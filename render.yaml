# Render blueprint — backend (Django API)
# Dashboard → New → Blueprint → bu repo'ni tanlang; render.yaml avtomatik o'qiladi.
services:
  - type: web
    name: taklifnoma-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: taklifnoma-api.onrender.com
      # Vercel frontend domenini kiriting (kerak bo'lsa — to'g'ridan-to'g'ri API uchun):
      # - key: DJANGO_CORS_ORIGINS
      #   value: https://taklifnoma.vercel.app
      # Agar bepul Postgres ulasangiz (Neon/Supabase/Render Postgres):
      # - key: DATABASE_URL
      #   value: postgresql://user:pass@host:5432/dbname
