name: keep-alive

# Render bepul instansiyasi 15 daqiqa harakatsizlikdan keyin uxlaydi va keyingi
# birinchi so'rov 30-50 soniya kutadi. /api/health/ bazaga SELECT 1 yuboradi,
# shuning uchun u instansiya bilan birga Postgres ulanishini ham uyg'oq tutadi
# (Django tomonida CONN_MAX_AGE=600 — ulanish qayta ishlatiladi, har so'rovda
# Tailscale orqali yangi ulanish ochilmaydi).
#
# MUHIM: GitHub rejadagi cron 10 daqiqada bir marta emas, amalda 4-6 soatda bir
# marta ishga tushadi (bepul runner'lar kechiktiriladi). Shuning uchun har bir
# ishga tushish 12 daqiqa davomida har daqiqada ping yuboradi: bitta run butun
# uxlash oynasini yopadi. Bu 100% kafolat emas — Render Starter rejasi yoki
# 24/7 ishlaydigan tashqi pinger bu muammoni butunlay yopadi.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "3,23,43 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the backend and its database
        run: |
          url="https://taklifnoma-1.onrender.com/api/health/"
          for attempt in 1 2 3; do
            start=$(date +%s)
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 "$url" || true)
            took=$(( $(date +%s) - start ))
            echo "attempt $attempt -> HTTP $code in ${took}s $(cat /tmp/health.json 2>/dev/null)"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::warning::health check did not return 200 - Render cold start, database offline or outage"
          fi

      - name: Stay warm for the sleep window
        run: |
          # Render 15 daqiqadan keyin uxlaydi: 12 daqiqa davomida har daqiqada
          # ping yuboramiz, shunda keyingi cron kechiksa ham instansiya uyg'oq.
          url="https://taklifnoma-1.onrender.com/api/health/"
          for i in $(seq 1 12); do
            sleep 60
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$url" || true)
            echo "warm $i/12 -> HTTP $code"
          done

      - name: Warm the frontend
        run: |
          curl -s -o /dev/null -w "frontend -> HTTP %{http_code}\n" --max-time 40 \
            https://taklifnoma-007.vercel.app/ || true
