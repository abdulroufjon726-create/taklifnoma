name: keep-alive

# Render bepul instansiyasi 15 daqiqa harakatsizlikdan keyin uxlaydi. Bu job
# /api/health/ ga ping yuboradi — u bazaga SELECT 1 qiladi, shuning uchun
# instansiya bilan birga Postgres ulanishi ham uyg'oq qoladi.
#
# Bu yerga uzoq "warm" sikli qo'yilmaydi: GitHub cron baribir 4-6 soatga
# kechikadi va uzoq runlar navbatda qolib, keyingi pinglarni bloklaydi.
# To'liq 24/7 uyg'oq ushlash uchun scripts/keep-warm.ps1 yoki
# scripts/keep-warm.sh (doimiy ishlaydigan mashinada) ishlatiladi.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "3,23,43 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the backend and its database
        run: |
          url="https://taklifnoma-1.onrender.com/api/health/"
          code=""
          for attempt in 1 2 3; do
            start=$(date +%s)
            code=$(curl -s -H "X-Keep-Warm: github" -o /tmp/health.json -w "%{http_code}" --max-time 60 "$url" || true)
            took=$(( $(date +%s) - start ))
            echo "attempt $attempt -> HTTP $code in ${took}s $(cat /tmp/health.json 2>/dev/null)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::health check did not return 200 - Render cold start, database offline or outage"

      - name: Warm the frontend
        run: |
          curl -s -o /dev/null -w "frontend -> HTTP %{http_code}\n" --max-time 40 \
            https://taklifnoma-007.vercel.app/ || true
