<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a14" />
    <meta
      name="description"
      content="Taklifnoma — onlayn taklifnoma yasovchi. Chiroyli effekt va animatsiyalar, aniq taymer, sirli kod orqali ulashish."
    />
    <title>Taklifnoma ✦ Onlayn taklifnoma yasovchi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%89%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://taklifnoma-1.onrender.com" />
    <link rel="preconnect" href="https://taklifnoma-1.onrender.com" crossorigin />
    <!-- Shriftlar render'ni bloklamaydi va faqat kerakli og'irliklar yuklanadi -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Inter:wght@400;600&family=Lora:wght@400;600&family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Inter:wght@400;600&family=Lora:wght@400;600&family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- JS yuklanguncha ko'rinadigan birinchi ekran: qora fon o'rniga
         zarf belgisi darhol chiqadi (FCP va "sekin ochilyapti" hissi uchun). -->
    <style>
      html,
      body {
        margin: 0;
        background: #0b0a14;
        color: #f5f1e6;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #1b1630 0%, #0b0a14 65%);
      }
      #boot-splash svg {
        width: 72px;
        height: 72px;
        color: #f5c451;
        opacity: 0.9;
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%,
        100% {
          transform: translateY(0) scale(1);
          opacity: 0.55;
        }
        50% {
          transform: translateY(-4px) scale(1.04);
          opacity: 0.95;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-splash" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
          <path d="m3 7 9 6.5L21 7" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
